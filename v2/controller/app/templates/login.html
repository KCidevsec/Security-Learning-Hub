<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Learning Hub — Login</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif;
           background: linear-gradient(135deg,#1e3a8a,#3b82f6); min-height:100vh;
           display:flex; align-items:center; justify-content:center; margin:0; }
    .card { background:#fff; padding:36px 40px; border-radius:12px; width:340px;
            box-shadow:0 10px 40px rgba(0,0,0,.25); }
    h1 { font-size:20px; margin:0 0 6px; color:#1e3a8a; }
    p.sub { margin:0 0 22px; color:#64748b; font-size:13px; }
    label { display:block; font-size:13px; color:#334155; margin:14px 0 4px; }
    input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px;
            box-sizing:border-box; font-size:14px; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:8px;
             background:#1e3a8a; color:#fff; font-size:15px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .err { background:#fef2f2; color:#b91c1c; padding:9px 12px; border-radius:8px;
           font-size:13px; margin-bottom:8px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Security Learning Hub</h1>
    <p class="sub">Sign in to launch your isolated lab.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
