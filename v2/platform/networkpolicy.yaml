# Tenant isolation for ${STUDENT_NS}.
#
# Model: default-deny all ingress, then re-allow only:
#   (1) traffic between pods in THIS namespace (Kali <-> its own targets), and
#   (2) the ingress controller reaching the Kali ttyd port (browser shell).
#
# Because EVERY tenant namespace is default-deny ingress, student A's pods cannot reach
# student B's pods (B drops it) — that's the cross-tenant guarantee. Egress is left open so
# Kali can reach its own targets and (optionally) the internet for tooling.
#
# NOTE: `kubectl port-forward` (used by `make shell` locally) goes via the API server, not
# pod networking, so it works regardless of these policies. Rule (2) is for real Ingress.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ${STUDENT_NS}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  # no ingress rules => deny all ingress by default
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: ${STUDENT_NS}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # empty podSelector with no namespaceSelector => all pods in THIS namespace only
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-ttyd
  namespace: ${STUDENT_NS}
spec:
  podSelector:
    matchLabels:
      app: kali
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # k3s/k3d run Traefik in kube-system; adjust for your ingress controller.
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 7681
---
# Egress isolation: default-deny all egress, then allow ONLY intra-namespace traffic and
# DNS. This stops a compromised target pod from pivoting OUT to other tenants or calling
# home over the internet, while keeping Kali <-> its own targets and name resolution working.
# (Image pulls happen at the kubelet/node level and are unaffected by pod egress policy.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: ${STUDENT_NS}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  # no egress rules => deny all egress by default
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-intra-ns-and-dns
  namespace: ${STUDENT_NS}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    # to any pod in THIS namespace (Kali -> its targets)
    - to:
        - podSelector: {}
    # to CoreDNS in kube-system for name resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
