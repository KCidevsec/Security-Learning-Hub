# Intentionally misconfigured: anonymous read access to /srv/ftp, no auth required.
listen=YES
listen_ipv6=NO
anonymous_enable=YES
no_anon_password=YES
local_enable=NO
write_enable=NO
anon_root=/srv/ftp
hide_ids=YES
dirmessage_enable=YES
xferlog_enable=YES
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
ftpd_banner=Welcome to the corporate public FTP server
# Passive mode; pasv_address is injected at runtime (pod IP) by entrypoint.sh.
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
